<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMO Ambulans Dash - Terengganu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { text-align: center; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
    h1 { font-size: 22px; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); margin-bottom: 4px; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 15px; }

    /* GAME CANVAS */
    #gameCanvas { background: linear-gradient(to bottom, #0284c7, #38bdf8, #bae6fd); border: 3px solid #0284c7; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); touch-action: manipulation; }

    /* BUTANG UTAMA LEADERBOARD */
    .btn-view-all { width: 320px; padding: 12px; background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: 1px solid #38bdf8; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: all 0.2s; margin-top: 15px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4); }
    .btn-view-all:hover { transform: translateY(-2px); background: linear-gradient(135deg, #0369a1, #0284c7); }

    /* POP-UP MODAL CARTA PENUH (LEBIH LEBAR) */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 999; justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; padding: 20px; width: 100%; max-width: 480px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 15px 30px rgba(0,0,0,0.7); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .modal-header h3 { color: #facc15; font-size: 17px; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; font-weight: bold; width: auto; padding: 0; }

    /* PODIUM TOP 3 DILEBARKAN & DIKEMAS */
    .podium-container { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin-bottom: 15px; width: 100%; height: 185px; }
    .podium { display: flex; flex-direction: column; align-items: center; justify-content: space-between; border-radius: 10px 10px 0 0; padding: 8px 4px; width: 32%; color: #0f172a; font-weight: bold; font-size: 11px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .podium .score { font-size: 13px; font-weight: 800; background: rgba(255,255,255,0.3); padding: 2px 6px; border-radius: 10px; }
    .podium .name { font-size: 11px; line-height: 1.2; margin-top: 2px; word-break: break-word; text-align: center; color: #0f172a; font-weight: 800; }
    .podium .details { font-size: 9px; line-height: 1.1; margin-top: 2px; opacity: 0.9; text-align: center; }

    /* WARNA PODIUM */
    .rank-1 { height: 170px; background: linear-gradient(135deg, #ffe066, #f59e0b); border: 2px solid #fbbf24; order: 2; } /* EMAS */
    .rank-2 { height: 140px; background: linear-gradient(135deg, #e2e8f0, #94a3b8); border: 2px solid #cbd5e0; order: 1; }  /* PERAK */
    .rank-3 { height: 115px; background: linear-gradient(135deg, #fdba74, #b45309); border: 2px solid #f97316; order: 3; color: white; } /* GANGSA */
    .rank-3 .name { color: white; }

    /* SENARAI RANKING */
    .rank-list { text-align: left; background: #0f172a; border-radius: 8px; padding: 8px; overflow-y: auto; flex-grow: 1; max-height: 200px; }
    .rank-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #1e293b; font-size: 12px; }
    .rank-item:last-child { border-bottom: none; }
    .rank-num { font-weight: bold; color: #38bdf8; width: 28px; }

    /* BORANG SKOR */
    .form-container { margin-top: 15px; background: #1e293b; padding: 18px; border-radius: 12px; width: 320px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); text-align: left; }
    label { font-size: 12px; color: #cbd5e0; margin-top: 6px; display: block; }
    input, select { width: 100%; padding: 9px; margin: 4px 0 8px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 13px; }
    button.btn-submit { width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 5px; }
    button.btn-submit:hover { background: #0369a1; }
    #statusMsg { margin-top: 8px; font-size: 12px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🚑 AMO Terengganu: Ambulans Dash</h1>
  <p class="sub">Kawal Ambulans & kumpul mata tertinggi!</p>

  <!-- SKRIN GAME UTAMA -->
  <canvas id="gameCanvas" width="320" height="400"></canvas>

  <!-- BUTANG SEMAK CARTA -->
  <button class="btn-view-all" onclick="openModal()">📜 Lihat Senarai Kedudukan Carta</button>

  <!-- BORANG PENDAFTARAN/TAMAT GAME -->
  <div class="form-container" id="scoreForm" style="display: none;">
    <h3 style="text-align: center; color: #facc15;">TAMAT GAME!</h3>
    <p style="text-align: center; font-size: 14px; margin-bottom: 10px;">Skor Anda: <b id="finalScore" style="font-size: 20px; color: #f87171;">0</b></p>
    
    <label>Nama Penuh / FB:</label>
    <input type="text" id="nama" placeholder="Ahmad Zaki" required>
    
    <label>No. WhatsApp:</label>
    <input type="tel" id="noTel" placeholder="0139876543" required>
    
    <label>Daerah (Terengganu):</label>
    <select id="daerah" required>
      <option value="">-- Pilih Daerah --</option>
      <option value="Kuala Terengganu">Kuala Terengganu</option>
      <option value="Kuala Nerus">Kuala Nerus</option>
      <option value="Marang">Marang</option>
      <option value="Hulu Terengganu">Hulu Terengganu</option>
      <option value="Dungun">Dungun</option>
      <option value="Kemaman">Kemaman</option>
      <option value="Besut">Besut</option>
      <option value="Setiu">Setiu</option>
      <option value="Luar Terengganu">Luar Terengganu</option>
    </select>

    <label>Kategori:</label>
    <select id="kategori">
      <option value="Orang Awam">Orang Awam</option>
      <option value="Warga KKM / AMO">Warga KKM / AMO</option>
    </select>

    <button class="btn-submit" onclick="hantarSkor()">Hantar Skor 🏆</button>
    <p id="statusMsg"></p>
    <button onclick="resetGame()" style="width: 100%; padding: 8px; background: #475569; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 6px;">Main Lagi 🔄</button>
  </div>

  <!-- MODAL / POPUP LEADERBOARD DENGAN PODIUM TOP 3 TERPERINCI -->
  <div class="modal-overlay" id="leaderboardModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🏆 Carta Kedudukan Pemain</h3>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>

      <!-- PODIUM TOP 3 DENGAN MAKLUMAT LENGKAP -->
      <div class="podium-container">
        <!-- RANK 2 (PERAK) -->
        <div class="podium rank-2">
          <span>🥈 PERAK</span>
          <div class="name" id="p2-name">-</div>
          <div class="details"><span id="p2-daerah">-</span><br><b id="p2-kat">-</b></div>
          <div class="score" id="p2-score">0 pts</div>
        </div>
        <!-- RANK 1 (EMAS) -->
        <div class="podium rank-1">
          <span>👑 EMAS</span>
          <div class="name" id="p1-name">-</div>
          <div class="details"><span id="p1-daerah">-</span><br><b id="p1-kat">-</b></div>
          <div class="score" id="p1-score">0 pts</div>
        </div>
        <!-- RANK 3 (GANGSA) -->
        <div class="podium rank-3">
          <span>🥉 GANGSA</span>
          <div class="name" id="p3-name">-</div>
          <div class="details"><span id="p3-daerah">-</span><br><b id="p3-kat">-</b></div>
          <div class="score" id="p3-score">0 pts</div>
        </div>
      </div>

      <h4 style="text-align: left; font-size: 12px; color: #94a3b8; margin-bottom: 6px;">Kedudukan Seterusnya:</h4>
      <div class="rank-list" id="rankList">
        <p style="text-align: center; color: #64748b; padding: 15px;">Memuatkan kedudukan...</p>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // PASTE URL GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/a/macros/moh.gov.my/s/AKfycbzSf8geUs_qyx36vwUHlQHjbOif8Kld-FPRcSYgLUj1TiY3voiI7iNtv1jxea9pxbdBdA/exec";

    let ambulans = { x: 50, y: 150, w: 38, h: 26, gravity: 0.22, lift: -5.0, velocity: 0 };
    let obstacles = [];
    let frame = 0;
    let score = 0;
    let gameOver = false;
    let gameStarted = false;

    function drawAmbulans() {
      let x = ambulans.x;
      let y = ambulans.y;

      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.beginPath();
      ctx.ellipse(x + 19, y + 28, 16, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#cbd5e0";
      ctx.fillRect(x + 3, y + 3, 35, 20);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x, y, 35, 20);

      ctx.fillStyle = "#f7fafc";
      ctx.fillRect(x + 2, y - 3, 30, 5);

      ctx.fillStyle = "#0284c7";
      ctx.fillRect(x + 24, y + 3, 9, 8);
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(x + 26, y + 4, 4, 4);

      ctx.fillStyle = "#ef4444";
      ctx.fillRect(x, y + 12, 35, 4);
      ctx.fillRect(x + 11, y + 4, 6, 6);
      ctx.fillRect(x + 13, y + 2, 2, 10);

      let sirenColor = (frame % 16 < 8) ? "#ef4444" : "#0284c7";
      ctx.fillStyle = sirenColor;
      ctx.shadowColor = sirenColor;
      ctx.shadowBlur = 8;
      ctx.fillRect(x + 13, y - 7, 9, 4);
      ctx.shadowBlur = 0;

      ctx.fillStyle = "#0f172a";
      ctx.fillRect(x + 6, y + 18, 8, 8);
      ctx.fillRect(x + 22, y + 18, 8, 8);
      
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(x + 8, y + 20, 4, 4);
      ctx.fillRect(x + 24, y + 20, 4, 4);
    }

    function createObstacle() {
      let gap = 160;
      let minHeight = 30;
      let maxHeight = canvas.height - gap - minHeight;
      let height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

      obstacles.push({
        x: canvas.width,
        top: height,
        bottom: canvas.height - height - gap,
        passed: false
      });
    }

    function update() {
      if (!gameStarted || gameOver) return;

      ambulans.velocity += ambulans.gravity;
      ambulans.y += ambulans.velocity;

      if (ambulans.y + ambulans.h >= canvas.height || ambulans.y <= 0) {
        endGame();
      }

      if (frame % 120 === 0) createObstacle();

      for (let i = 0; i < obstacles.length; i++) {
        let obs = obstacles[i];
        obs.x -= 1.6;

        if (
          ambulans.x < obs.x + 40 &&
          ambulans.x + ambulans.w > obs.x &&
          (ambulans.y < obs.top || ambulans.y + ambulans.h > canvas.height - obs.bottom)
        ) {
          endGame();
        }

        if (obs.x + 40 < ambulans.x && !obs.passed) {
          score++;
          obs.passed = true;
        }
      }

      if (obstacles.length && obstacles[0].x < -40) obstacles.shift();

      frame++;
    }

    function draw() {
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let obs of obstacles) {
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(obs.x, 0, 40, obs.top);
        ctx.fillStyle = "#334155";
        ctx.fillRect(obs.x + 33, 0, 7, obs.top);

        ctx.fillStyle = "#1e293b";
        ctx.fillRect(obs.x, canvas.height - obs.bottom, 40, obs.bottom);
        ctx.fillStyle = "#334155";
        ctx.fillRect(obs.x + 33, canvas.height - obs.bottom, 7, obs.bottom);
      }

      drawAmbulans();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 18px Arial";
      ctx.shadowColor = "rgba(0,0,0,0.5)";
      ctx.shadowBlur = 4;
      ctx.fillText("Skor: " + score, 15, 30);
      ctx.shadowBlur = 0;

      if (!gameStarted) {
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 14px Arial";
        ctx.fillText("Tekan/Tap Skrin Untuk Mula!", 65, 190);
      }
    }

    function loop() {
      update();
      draw();
      if (!gameOver) requestAnimationFrame(loop);
    }

    function jump() {
      if (!gameStarted) gameStarted = true;
      if (!gameOver) ambulans.velocity = ambulans.lift;
    }

    window.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
    canvas.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });
    canvas.addEventListener("mousedown", jump);

    function endGame() {
      gameOver = true;
      document.getElementById("finalScore").innerText = score;
      document.getElementById("scoreForm").style.display = "block";
    }

    function resetGame() {
      ambulans.y = 150;
      ambulans.velocity = 0;
      obstacles = [];
      frame = 0;
      score = 0;
      gameOver = false;
      gameStarted = false;
      document.getElementById("scoreForm").style.display = "none";
      document.getElementById("statusMsg").innerText = "";
      loop();
    }

    function openModal() { document.getElementById("leaderboardModal").style.display = "flex"; }
    function closeModal() { document.getElementById("leaderboardModal").style.display = "none"; }

    function loadLeaderboard() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          if (!data || data.length === 0) return;

          // Isi Top 3 (Emas, Perak, Gangsa) bersama Daerah & Kategori
          if (data[0]) { 
            document.getElementById("p1-name").innerText = data[0].nama; 
            document.getElementById("p1-daerah").innerText = data[0].daerah || "-";
            document.getElementById("p1-kat").innerText = data[0].kategori || "-";
            document.getElementById("p1-score").innerText = data[0].score + " pts"; 
          }
          if (data[1]) { 
            document.getElementById("p2-name").innerText = data[1].nama; 
            document.getElementById("p2-daerah").innerText = data[1].daerah || "-";
            document.getElementById("p2-kat").innerText = data[1].kategori || "-";
            document.getElementById("p2-score").innerText = data[1].score + " pts"; 
          }
          if (data[2]) { 
            document.getElementById("p3-name").innerText = data[2].nama; 
            document.getElementById("p3-daerah").innerText = data[2].daerah || "-";
            document.getElementById("p3-kat").innerText = data[2].kategori || "-";
            document.getElementById("p3-score").innerText = data[2].score + " pts"; 
          }

          // Isi Senarai Kedudukan #4 Ke Bawah
          let rankListHTML = "";
          for (let i = 3; i < data.length; i++) {
            rankListHTML += `
              <div class="rank-item">
                <span class="rank-num">#${i + 1}</span>
                <span><b>${data[i].nama}</b> (${data[i].daerah || 'Terengganu'}) - <i style="font-size:11px; color:#cbd5e0;">${data[i].kategori || 'Awam'}</i></span>
                <span style="color: #facc15; font-weight: bold;">${data[i].score} pts</span>
              </div>
            `;
          }
          document.getElementById("rankList").innerHTML = rankListHTML || "<p style='text-align:center; color:#64748b; padding:10px;'>Tiada data tambahan lagi.</p>";
        })
        .catch(err => console.error("Error loading leaderboard:", err));
    }

    function hantarSkor() {
      let nama = document.getElementById("nama").value;
      let noTel = document.getElementById("noTel").value;
      let daerah = document.getElementById("daerah").value;
      let kategori = document.getElementById("kategori").value;
      let statusMsg = document.getElementById("statusMsg");

      if (!nama || !noTel || !daerah) {
        alert("Sila isi Nama, No. WhatsApp, dan Pilih Daerah!");
        return;
      }

      statusMsg.style.color = "#facc15";
      statusMsg.innerText = "Menghantar data...";

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
          nama: nama, 
          noTel: noTel, 
          daerah: daerah, 
          kategori: kategori, 
          score: score 
        })
      })
      .then(() => {
        statusMsg.style.color = "#4ade80";
        statusMsg.innerText = "✅ Skor berjaya dihantar!";
        setTimeout(() => { loadLeaderboard(); }, 1500);
      })
      .catch(err => {
        statusMsg.style.color = "#f87171";
        statusMsg.innerText = "❌ Gagal hantar data.";
      });
    }

    loadLeaderboard();
    loop();
  </script>
</body>
</html>
